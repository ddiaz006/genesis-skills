# =============================================================================
# Kubernetes Indexed Job template (the analogue of a Slurm/PBS job array)
# Each pod gets JOB_COMPLETION_INDEX = 0 .. completions-1.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: sweep-<username>
  labels:
    owner: <username>
spec:
  completions: 20                     # number of array tasks
  parallelism: 5                      # max tasks running at once
  completionMode: Indexed
  backoffLimitPerIndex: 1             # retries per index (Kubernetes >= 1.29)
  maxFailedIndexes: 3                 # fail the Job after this many indexes fail
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: python:3.12-slim
        env:
        - name: N_TASKS
          value: "20"
        command: ["sh", "-c"]
        args:
        - |
          set -euo pipefail
          echo "task $JOB_COMPLETION_INDEX of $N_TASKS on $(hostname)"
          python -c "import os; i=int(os.environ['JOB_COMPLETION_INDEX']); print('param =', 0.1*i)"
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits:   {cpu: "1", memory: 2Gi}
