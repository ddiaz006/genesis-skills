# =============================================================================
# Kubernetes single-GPU batch Job template
# Replace <username>, the image and the command. Site skills give the GPU
# resource names and node labels (for example nvidia.com/gpu.product).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-<username>
  labels:
    owner: <username>
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # --- Optional: pin a GPU model -----------------------------------------
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: nvidia.com/gpu.product
      #           operator: In
      #           values: ["NVIDIA-A10"]
      containers:
      - name: main
        image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime
        command: ["sh", "-c"]
        args:
        - |
          set -euo pipefail
          nvidia-smi
          python -c "import torch; print('cuda:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
        resources:
          requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
          limits:   {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: dshm                    # larger /dev/shm for data loaders / NCCL
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
