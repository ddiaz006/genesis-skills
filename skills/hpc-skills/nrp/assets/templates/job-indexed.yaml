# =============================================================================
# NRP Nautilus parameter sweep (Indexed Job = job array)
# Nautilus has no fair-share queue: cap concurrency with `parallelism`
# instead of submitting many separate Jobs.
# Each pod sees JOB_COMPLETION_INDEX = 0 .. completions-1.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: sweep-<username>
  labels:
    owner: <username>
spec:
  completions: 50
  parallelism: 10
  completionMode: Indexed
  backoffLimitPerIndex: 1
  maxFailedIndexes: 5
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: python:3.12-slim
        command: ["sh", "-c"]
        args:
        - |
          set -euo pipefail
          python - <<'PY'
          import os
          i = int(os.environ["JOB_COMPLETION_INDEX"])
          lr = 10 ** (-5 + 4 * i / 49)   # 50 log-spaced values
          print(f"task {i}: lr={lr:.2e}")
          PY
        resources:                    # <=1 CPU and <=2 GB: exempt from utilization thresholds
          requests: {cpu: "1", memory: 2Gi}
          limits:   {cpu: "1", memory: 2Gi}
